<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <title>Панель управления</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Nunito:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0b0f19; --card:#141a2b; --accent:#00e5ff; --text:#e8eaf6; --border:rgba(0,229,255,0.12); --radius:14px; }
    body { background:var(--bg); color:var(--text); font-family:'Nunito',sans-serif; padding:20px; }
    .card { background:var(--card); border:1px solid var(--border); padding:16px; border-radius:var(--radius); margin-bottom:15px; }
    h2 { font-family:'Rajdhani'; color:var(--accent); text-transform:uppercase; margin:20px 0 10px; }
    .btn { padding:10px 15px; border-radius:8px; border:none; font-weight:700; cursor:pointer; margin-right:5px; }
    .btn-ok { background:#22c55e; color:#fff; }
    .btn-no { background:#ef4444; color:#fff; }
    #loader { color:var(--accent); font-weight:bold; }
  </style>
</head>
<body>

  <h2>📋 Новые заявки</h2>
  <div id="submissions-list">Загрузка...</div>

  <hr style="border:0; border-top:1px solid var(--border); margin:30px 0;">

  <h2>🎮 Список всех клубов</h2>
  <div id="club-list">Загрузка...</div>

<script>
const SUPABASE_URL = "https://dyxfvhjggmessxfuhnbr.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5eGZ2aGpnZ21lc3N4ZnVobmJyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc4NjE0NjcsImV4cCI6MjA4MzQzNzQ2N30.RUG23UQaa7ZN8y3hXbIfaErWRQz9rAUsSp8B8dAv28A";
const EDGE_URL = "https://dyxfvhjggmessxfuhnbr.supabase.co/functions/v1/admin-action";

const tg = window.Telegram?.WebApp;
tg.expand();

async function loadData() {
  // 1. Загружаем заявки через Edge Function (чтобы проверить права админа)
  const initData = tg?.initData || '';
  try {
    const res = await fetch(EDGE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'getSubmissions', initData })
    });
    const json = await res.json();
    
    const sList = document.getElementById('submissions-list');
    if (!json.submissions || json.submissions.length === 0) {
      sList.innerHTML = "Нет новых заявок";
    } else {
      sList.innerHTML = json.submissions.map(s => `
        <div class="card">
          <b>${s.name}</b> (${s.district})<br>
          <small>${s.address}</small><br><br>
          <button class="btn btn-ok" onclick="action('${s.id}', 'approveSubmission')">✅ Одобрить</button>
          <button class="btn btn-no" onclick="action('${s.id}', 'rejectSubmission')">❌ Отклонить</button>
        </div>
      `).join('');
    }
  } catch (e) { document.getElementById('submissions-list').innerHTML = "Ошибка доступа или загрузки"; }

  // 2. Загружаем уже одобренные клубы
  const resClubs = await fetch(SUPABASE_URL + '/rest/v1/clubs?select=id,name,district&status=eq.approved', {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
  });
  const clubs = await resClubs.json();
  document.getElementById('club-list').innerHTML = clubs.map(c => `
    <div class="card" style="display:flex; justify-content:space-between;">
      <span><b>${c.name}</b> — ${c.district}</span>
    </div>
  `).join('');
}

async function action(id, type) {
  if (!confirm('Вы уверены?')) return;
  const initData = tg?.initData || '';
  const res = await fetch(EDGE_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: type, id, initData })
  });
  const result = await res.json();
  if (result.ok) { alert('Готово!'); loadData(); } 
  else { alert('Ошибка: ' + result.error); }
}

loadData();
</script>
</body>
</html>
