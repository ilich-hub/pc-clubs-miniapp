<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Cyber Clubs</title>
  <meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- ===== style.css ===== -->
  <style>
    body {
      margin: 0;
      background: #0b0f19;
      color: #fff;
      font-family: Inter, system-ui, sans-serif;
    }

    header {
  padding: 16px;
  position: sticky;
  top: 0;
  z-index: 500;
  background: #0b0f19;
    }

    select {
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      background: #141a2b;
      color: #fff;
      border: none;
      margin-top: 8px;
    }

    #clubs {
  padding: 16px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
    }

    .card {
  background: linear-gradient(180deg, #141a2b, #0f1322);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  transition: transform .2s ease, box-shadow .2s ease;
  display: flex;
  flex-direction: column;
    }

.zone-item {
  position: relative;
  cursor: pointer;
  transition: transform .15s ease, background .15s ease;
}

.zone-item:active {
  transform: scale(0.97);
  background: #222a44 !important;
}

.zone-item::after {
  content: "›";
  position: absolute;
  right: 14px;
  font-size: 22px;
  opacity: 0.5;
}
    
    .card:active {
  transform: scale(0.98);
  box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }

    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    .card h2 {
  margin: 12px;
  font-size: 16px;
  font-weight: 600;
  line-height: 1.2;
    }

    .card button {
  margin: 12px;
  margin-top: auto;
  padding: 13px;
  width: calc(100% - 24px);
  border: none;
  border-radius: 14px;
  background: linear-gradient(135deg, #00e5ff, #00bcd4);
  color: #001418;
  font-weight: 700;
  font-size: 14px;
    }

.skeleton {
  background: #141a2b;
  border-radius: 18px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  height: 100%;
}

.skeleton-img {
  height: 140px;
  background: linear-gradient(90deg, #1a2033 25%, #222a44 37%, #1a2033 63%);
  background-size: 400% 100%;
  animation: shimmer 1.4s ease infinite;
}

.skeleton-text {
  height: 16px;
  margin: 12px;
  border-radius: 8px;
  background: #1a2033;
}

.skeleton-btn {
  height: 44px;
  margin: 12px;
  border-radius: 14px;
  background: #1a2033;
  margin-top: auto;
}

@keyframes shimmer {
  0%   { background-position: 100% 0; }
  100% { background-position: -100% 0; }
}

    .tabs {
  display: flex;
  gap: 10px;
  margin: 16px 0;
  overflow-x: auto;
}

.tab {
  padding: 10px 16px;
  border-radius: 20px;
  background: #1a2033;
  color: #aaa;
  font-weight: 600;
  white-space: nowrap;
}

.tab.active {
  background: #00e5ff;
  color: #001418;
}

.section { margin-top: 16px; }
.section h3 { margin-bottom: 8px; }

#bottomNav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 64px;
  background: #0b0f19;
  display: flex;
  border-top: 1px solid #1f253a;
  z-index: 1000;
}

.nav-btn {
  flex: 1;
  background: none;
  border: none;
  color: #8a93b2;
  font-size: 14px;
  font-weight: 600;
}

.nav-btn.active { color: #00e5ff; }

body { padding-bottom: 70px; }

    .card-img-wrap { position: relative; }

.fav-heart {
  position: absolute;
  top: 10px; right: 10px;
  font-size: 22px;
  color: #ffffff;
  opacity: 1;
  background: rgba(0,0,0,0.35);
  border-radius: 50%;
  padding: 6px;
  cursor: pointer;
  transition: transform .2s ease, color .2s ease, opacity .2s ease;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.fav-heart.active { color: #ff3b3b; }
.fav-heart:active { transform: scale(0.9); }

.fav-heart.animate { animation: heartPop 0.25s ease; }

@keyframes heartPop {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.35); }
  70%  { transform: scale(0.95); }
  100% { transform: scale(1); }
}
    
    .photos-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
    }

    .fade-in { animation: fadeIn .35s ease; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

    html, body {
  touch-action: manipulation;
  overscroll-behavior: none;
    }

    .tab-fade-out { animation: tabFadeOut .15s ease forwards; }
    .tab-fade-in  { animation: tabFadeIn  .25s ease forwards; }

@keyframes tabFadeOut {
  from { opacity: 1; transform: translateY(0); }
  to   { opacity: 0; transform: translateY(-6px); }
}

@keyframes tabFadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

    #promoBtn.active, #tournamentBtn.active {
  background: linear-gradient(135deg, #00e5ff, #00bcd4);
  color: #001418;
  box-shadow: 0 0 0 2px #00e5ff;
  transform: scale(0.95);
}

    #searchToggle.active {
  background: linear-gradient(135deg, #00e5ff, #00bcd4);
  color: #001418;
  box-shadow: 0 0 0 2px #00e5ff;
    }

    .search-animate { animation: searchSlide .25s ease; }

@keyframes searchSlide {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: translateY(0); }
}

    .back-btn {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: #1a2033;
  border: none;
  color: #fff;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 12px;
  cursor: pointer;
}

.back-btn:active { transform: scale(0.92); }

a { -webkit-tap-highlight-color: transparent; user-select: none; }

.info-row {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 15px;
  line-height: 1.4;
  margin-top: 8px;
}

.info-row svg { width: 18px; height: 18px; flex-shrink: 0; }

.photo-skeleton {
  width: 100%;
  height: 140px;
  border-radius: 14px;
  background: linear-gradient(90deg, #1a2033 25%, #222a44 37%, #1a2033 63%);
  background-size: 400% 100%;
  animation: shimmer 1.4s ease infinite;
}

* { -webkit-tap-highlight-color: transparent; }

#ratingStars span { transition: transform .15s ease, opacity .15s ease; }
#ratingStars span:active { transform: scale(0.9); }

.photos-grid img { transition: transform .15s ease; }
.photos-grid img:active { transform: scale(0.97); }
  </style>
</head>

<body>
  <header>
    <h1>Компьютерные клубы</h1>

    <div style="display:flex;gap:8px;margin-top:12px;align-items:center">

      <select id="districtFilter" style="
        flex:1;height:44px;padding:0 12px;
        border-radius:12px;background:#141a2b;color:#fff;border:none;
        font-size:14px;appearance:none;-webkit-appearance:none;margin-top:0;
      ">
        <option value="">Все районы</option>
      </select>

      <button id="promoBtn" style="width:44px;height:44px;border-radius:12px;border:none;background:#1a2033;color:#fff;font-size:18px;">
        🔥<span id="promoCount" style="margin-left:2px;font-size:12px"></span>
      </button>

      <button id="tournamentBtn" style="width:44px;height:44px;border-radius:12px;border:none;background:#1a2033;color:#fff;font-size:18px;">
        🏆<span id="tournamentCount" style="margin-left:2px;font-size:12px"></span>
      </button>

      <button id="searchToggle" style="width:44px;height:44px;border-radius:12px;border:none;background:#141a2b;color:#fff;font-size:18px;">
        🔍
      </button>
    </div>

    <input
      id="searchInput"
      type="text"
      placeholder="Поиск клуба"
      style="
        display:none;margin-top:10px;width:100%;height:44px;
        padding:0 14px;border-radius:12px;background:#141a2b;
        border:none;outline:none;color:#fff;font-size:14px;
      "
    />
  </header>
  <!-- FIX 1: убраны два лишних </div> из оригинала -->

  <main id="clubs"></main>
  <section id="favoritesPage" style="display:none;"></section>
  <section id="clubPage"      style="display:none;"></section>
  <section id="zonePage"      style="display:none;"></section>

  <script>
    const SUPABASE_URL = "https://dyxfvhjggmessxfuhnbr.supabase.co";
    const SUPABASE_KEY = "sb_publishable_WVIM_p30Vjag_MTxDWapEQ__W0SftDv";
    const tg = window.Telegram?.WebApp;

    const clickLock = {};
    function lockClick(key, delay = 600) {
      if (clickLock[key]) return true;
      clickLock[key] = true;
      setTimeout(() => delete clickLock[key], delay);
      return false;
    }

    // XSS-защита
    function safe(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // FIX 7: Безопасные обёртки для localStorage
    function lsGet(key, fallback) {
      try {
        const v = localStorage.getItem(key);
        return v !== null ? v : (fallback !== undefined ? fallback : null);
      } catch {
        return fallback !== undefined ? fallback : null;
      }
    }
    function lsSet(key, value) {
      try { localStorage.setItem(key, String(value)); } catch {}
    }

    if (tg) { tg.ready(); tg.expand(); }

    const SCROLL_TO_TOP = () => window.scrollTo(0, 0);
    const HIDE_HEADER   = () => document.querySelector("header").style.display = "none";
    const SHOW_HEADER   = () => document.querySelector("header").style.display = "block";

    const clubsContainer = document.getElementById("clubs");
    const filter         = document.getElementById("districtFilter");
    const searchInput    = document.getElementById("searchInput");
    const searchToggle   = document.getElementById("searchToggle");
    const clubPage       = document.getElementById("clubPage");
    const promoBtn       = document.getElementById("promoBtn");
    const tournamentBtn  = document.getElementById("tournamentBtn");

    let clubs          = [];
    let clubsFull      = {};
    let activeZoneIndex  = 0;
    let clubOpenedFrom   = "clubs";
    let specialFilter    = "";
    let skipTabAnimation = false;
    let selectedRating   = 0;
    let currentClubId    = null;

    // FIX 8: единая формула для топа и сортировки
    function calcScore(club) {
      const userRating = club.rating_count > 0
        ? club.rating_sum / club.rating_count : 0;
      let score = userRating;
      if (club.recommended) score += 0.2;
      if (club.promo)        score += 0.1;
      if (club.tournament)   score += 0.1;
      return Math.min(5, score);
    }

    // ── ПОИСК ──────────────────────────────────────────────────────────────────
    searchToggle.onclick = () => {
      const isOpen = searchInput.style.display === "block";
      specialFilter = "";
      promoBtn.classList.remove("active");
      tournamentBtn.classList.remove("active");

      if (isOpen) {
        searchInput.style.display = "none";
        searchInput.value = "";
        searchToggle.classList.remove("active");
      } else {
        searchInput.style.display = "block";
        searchInput.classList.remove("search-animate");
        void searchInput.offsetWidth;
        searchInput.classList.add("search-animate");
        searchInput.focus();
        searchToggle.classList.add("active");
      }
      renderClubs();
    };

    filter.addEventListener("change", () => {
      specialFilter = "";
      promoBtn.classList.remove("active");
      tournamentBtn.classList.remove("active");
      renderClubs();
    });

    searchInput.addEventListener("input", () => {
      specialFilter = "";
      promoBtn.classList.remove("active");
      tournamentBtn.classList.remove("active");
      renderClubs();
    });

    promoBtn.onclick = () => {
      if (lockClick("promo", 400)) return;
      specialFilter = specialFilter === "promo" ? "" : "promo";
      promoBtn.classList.toggle("active", specialFilter === "promo");
      tournamentBtn.classList.remove("active");
      searchInput.style.display = "none";
      searchInput.value = "";
      searchToggle.classList.remove("active");
      renderClubs();
    };

    tournamentBtn.onclick = () => {
      if (lockClick("tournament", 400)) return;
      specialFilter = specialFilter === "tournament" ? "" : "tournament";
      tournamentBtn.classList.toggle("active", specialFilter === "tournament");
      promoBtn.classList.remove("active");
      searchInput.style.display = "none";
      searchInput.value = "";
      searchToggle.classList.remove("active");
      renderClubs();
    };

    // ── ЗАГРУЗКА КЛУБОВ ────────────────────────────────────────────────────────
    async function loadClubs() {
      clubsContainer.innerHTML = `
        <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-text"></div><div class="skeleton-btn"></div></div>
        <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-text"></div><div class="skeleton-btn"></div></div>
      `;

      const CACHE_TTL = 24 * 60 * 60 * 1000;
      const cached    = lsGet("clubs_cache");
      const cacheTime = lsGet("clubs_cache_time");
      let usingCache  = false;

      // Свежий кэш — рендерим и выходим
      if (cached && cacheTime && (Date.now() - Number(cacheTime)) < CACHE_TTL) {
        try {
          clubs = JSON.parse(cached);
          renderDistricts();
          renderClubs();
          return;
        } catch {
          lsSet("clubs_cache", "");
        }
      }

      // Устаревший кэш — показываем пока грузим
      if (cached) {
        try {
          clubs = JSON.parse(cached);
          renderDistricts();
          renderClubs();
          usingCache = true;
        } catch {
          lsSet("clubs_cache", "");
        }
      }

      // Запрос к Supabase
      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/clubs?select=id,name,district,photos,rating_sum,rating_count,recommended,promo,tournament`,
          { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
        );

        if (!res.ok) throw new Error(`Ошибка сервера: ${res.status}`);
        const freshData = await res.json();
        if (!Array.isArray(freshData)) throw new Error("Неверный формат данных");

        if (JSON.stringify(freshData) !== JSON.stringify(clubs)) {
          clubs = freshData;
          lsSet("clubs_cache",      JSON.stringify(clubs));
          lsSet("clubs_cache_time", Date.now());
          renderDistricts();
          renderClubs();
        } else {
          // FIX: данные совпали с кэшем, но если кэша не было — всё равно рендерим
          if (!usingCache) {
            renderDistricts();
            renderClubs();
          }
        }

      } catch (err) {
        console.warn("⚠️ Ошибка загрузки:", err.message);
        if (!usingCache) {
          clubsContainer.innerHTML = `
            <div style="padding:40px 20px;text-align:center;opacity:.7;grid-column:1/-1">
              <div style="font-size:48px;margin-bottom:16px">⚠️</div>
              <h3>Не удалось загрузить клубы</h3>
              <p style="opacity:.8;margin:12px 0">Проверьте подключение к интернету</p>
              <button onclick="loadClubs()" style="
                margin-top:16px;padding:12px 24px;border:none;border-radius:12px;
                background:#00e5ff;font-weight:600;cursor:pointer;
              ">🔄 Попробовать снова</button>
            </div>
          `;
        }
      }
    }

    function renderDistricts() {
      filter.innerHTML = `<option value="">Все районы</option>`;
      [...new Set(clubs.map(c => c.district))].forEach(d => {
        const opt = document.createElement("option");
        opt.value = opt.textContent = d;
        filter.appendChild(opt);
      });
    }

    function renderClubs() {
      clubsContainer.innerHTML = "";
      let visibleCount = 0;

      const topClubId = clubs.slice().sort((a, b) => calcScore(b) - calcScore(a))[0]?.id;

      const promoCount      = clubs.filter(c => c.promo).length;
      const tournamentCount = clubs.filter(c => c.tournament).length;
      document.getElementById("promoCount").textContent      = promoCount      > 0 ? promoCount      : "";
      document.getElementById("tournamentCount").textContent = tournamentCount > 0 ? tournamentCount : "";

      if (specialFilter === "promo") {
        clubsContainer.innerHTML = `
          <div style="grid-column:1/-1;margin-bottom:12px;padding:10px;border-radius:12px;
               background:#102a1c;color:#00e676;font-weight:600;text-align:center;">
            🔥 Показаны клубы с акциями
          </div>`;
      }
      if (specialFilter === "tournament") {
        clubsContainer.innerHTML = `
          <div style="grid-column:1/-1;margin-bottom:12px;padding:10px;border-radius:12px;
               background:#1a2033;color:#00e5ff;font-weight:600;text-align:center;">
            🏆 Показаны клубы с турнирами
          </div>`;
      }

      const selected = filter.value;
      const query    = searchInput.value.toLowerCase();

      clubs
        .filter(c => {
          if (specialFilter === "promo"      && !c.promo)      return false;
          if (specialFilter === "tournament" && !c.tournament) return false;
          return (
            (!selected || c.district === selected) &&
            (!query    || (c.name || "").toLowerCase().includes(query))
          );
        })
        .sort((a, b) => calcScore(b) - calcScore(a))
        .forEach(c => {
          visibleCount++;
          const img = Array.isArray(c.photos) && c.photos.length
            ? c.photos[0].url
            : "https://via.placeholder.com/400x200";

          clubsContainer.innerHTML += `
            <div class="card">
              <div class="card-img-wrap">
                <img src="${img}" loading="lazy"
                     onerror="this.src='https://via.placeholder.com/400x200'">
                ${c.id === topClubId ? `
                  <div style="position:absolute;bottom:10px;left:10px;padding:5px 10px;
                       border:1.5px solid rgba(255,255,255,0.9);color:#ffffff;font-size:12px;
                       font-weight:600;border-radius:999px;background:rgba(0,0,0,0.25);
                       backdrop-filter:blur(4px);">👑 Топ клуб</div>
                ` : ""}
                <div class="fav-heart ${isFavorite(c.id) ? "active" : ""}" data-id="${c.id}">♥</div>
              </div>

              <h2 style="display:flex;align-items:center;gap:6px">
                ${safe(c.name)}
                <span style="font-size:13px;color:#f5c451;font-weight:700">
                  ⭐ ${c.rating_count ? (c.rating_sum / c.rating_count).toFixed(1) : "—"}
                </span>
              </h2>

              ${c.promo ? `
                <div style="margin:0 12px 6px;padding:6px 8px;background:#102a1c;
                     border-radius:8px;font-size:12px;color:#00e676;font-weight:600;
                     white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                  🔥 ${safe(c.promo).slice(0,30)}
                </div>` : ""}

              ${c.tournament ? `
                <div style="margin:0 12px 6px;padding:6px 8px;background:#1a2033;
                     border-radius:8px;font-size:12px;color:#00e5ff;font-weight:600;
                     white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                  🏆 ${safe(c.tournament).slice(0,30)}
                </div>` : ""}

              <button onclick="clubOpenedFrom='clubs'; openClub(${Number(c.id)})">Подробнее</button>
            </div>
          `;
        });

      if (visibleCount === 0) {
        clubsContainer.innerHTML = `
          <div style="grid-column:1/-1;text-align:center;padding:40px 20px;opacity:.7">
            <div style="font-size:48px;margin-bottom:12px">😕</div>
            <h3>Ничего не найдено</h3>
            <p style="margin-top:8px">Попробуйте изменить фильтры или поиск</p>
          </div>`;
      }
    }

    // FIX 3: try/catch — не зависает при ошибке сети
    async function openClub(id) {
      currentClubId = Number(id);

      if (clubsFull[id]) { renderClubPage(clubsFull[id]); return; }

      clubPage.innerHTML = `<div style="padding:40px;text-align:center;opacity:.7">
        <div style="font-size:40px">⏳</div><p>Загрузка клуба...</p></div>`;

      SCROLL_TO_TOP();
      document.getElementById("clubs").style.display = "none";
      document.getElementById("favoritesPage").style.display = "none";
      clubPage.style.display = "block";
      HIDE_HEADER();

      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/clubs?id=eq.${id}`,
          { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
        );
        if (!res.ok) throw new Error(`Ошибка сервера: ${res.status}`);
        const data = await res.json();
        if (!data || !data[0]) throw new Error("Клуб не найден");
        clubsFull[id] = data[0];
        renderClubPage(data[0]);
      } catch (err) {
        console.warn("openClub error:", err.message);
        clubPage.innerHTML = `
          <div style="padding:40px 20px;text-align:center;opacity:.8">
            <div style="font-size:48px;margin-bottom:16px">⚠️</div>
            <h3>Не удалось загрузить клуб</h3>
            <p style="opacity:.7;margin:12px 0">Проверьте подключение к интернету</p>
            <button onclick="goBack()" style="margin-top:16px;padding:12px 24px;border:none;
              border-radius:12px;background:#1a2033;color:#fff;font-weight:600;cursor:pointer;">
              ← Назад
            </button>
          </div>`;
      }
    }

    function renderClubPage(club) {
      SCROLL_TO_TOP();

      clubPage.dataset.photos          = JSON.stringify(club.photos || []);
      clubPage.dataset.lat             = club.lat          || "";
      clubPage.dataset.lng             = club.lng          || "";
      clubPage.dataset.admin           = club.admin_link   || "";
      clubPage.dataset.games           = JSON.stringify(club.games  || []);
      clubPage.dataset.zones           = JSON.stringify(club.zones  || []);
      clubPage.dataset.address         = club.address      || "";
      clubPage.dataset.workTime        = club.work_time    || "";
      clubPage.dataset.phone           = club.phone        || "";
      clubPage.dataset.instagram       = club.instagram    || "";
      clubPage.dataset.promo           = club.promo        || "";
      clubPage.dataset.tournament      = club.tournament   || "";
      clubPage.dataset.promoImage      = club.promo_image      || "";

    function showTab(tab) {
      const content = document.getElementById("tabContent");
      if (!content) return;

      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelector(`.tab[onclick*="${tab}"]`)?.classList.add("active");

      if (skipTabAnimation) {
        skipTabAnimation = false;
        content.innerHTML = buildTabHTML(tab);
        return;
      }

      if (content.dataset.animating === "1") return;
      content.dataset.animating = "1";
      content.className = "";
      content.classList.add("tab-fade-out");

      setTimeout(() => {
        content.innerHTML = buildTabHTML(tab);  // нет ранних return → animating всегда сбрасывается
        content.className = "";
        content.classList.add("tab-fade-in");
        content.dataset.animating = "0";
      }, 180);
    }

      window.open(link, "_blank");

    // FIX 9: Убран touchend preventDefault — конфликтовал со скроллом.
    // touch-action: manipulation на body делает то же самое.

    function isClubOpen(workTime) {
      if (!workTime) return null;
      const clean = workTime.replace(/[–—]/g,"-").replace(/\./g,":").replace(/\s+/g,"");
      if (!clean.includes("-")) return null;
      const [start, end] = clean.split("-");
      const parse = t => {
        const [h,m] = t.split(":").map(Number);
        return isNaN(h)||isNaN(m) ? null : h*60+m;
      };
      const s = parse(start), e = parse(end);
      if (s===null||e===null) return null;
      const cur = new Date().getHours()*60 + new Date().getMinutes();
      return s < e ? cur>=s && cur<=e : cur>=s || cur<=e;
    }

    function setActiveBottomTab(tab) {
      document.getElementById("tabClubs").classList.toggle("active", tab === "clubs");
      document.getElementById("tabFavs").classList.toggle("active",  tab === "favorites");
    }

    document.addEventListener("click", e => {
      const heart = e.target.closest(".fav-heart");
      if (heart) toggleFavorite(heart.dataset.id);
    });

    function openRatingModal() {
      selectedRating = 0;
      updateStars(0);
      document.getElementById("ratingModal").style.display = "flex";
      const sc = document.getElementById("ratingStars");
      if (!sc.dataset.ready) {
        sc.dataset.ready = "1";
        sc.addEventListener("click", e => {
          const star = e.target.closest("span");
          if (star) updateStars(Number(star.dataset.star));
        });
      }
    }

    function closeRatingModal() {
      document.getElementById("ratingModal").style.display = "none";
    }

    function updateStars(count) {
      selectedRating = count;
      document.querySelectorAll("#ratingStars span").forEach((s,i) => {
        s.style.opacity = i < count ? "1"           : "0.3";
        s.style.filter  = i < count ? "grayscale(0)" : "grayscale(1)";
      });
    }

    // FIX 4 + FIX 5: try/catch; не сохраняем localStorage при сетевой ошибке;
    // обновляем clubsFull чтобы повторное открытие показывало актуальный рейтинг
    async function submitRating() {
      if (!selectedRating) { alert("Выберите оценку"); return; }
      const clubId = currentClubId;
      if (!clubId) { alert("Ошибка клуба"); return; }

      let rated = [];
      try { rated = JSON.parse(lsGet("rated_clubs","[]")); } catch {}
      if (rated.includes(clubId)) { alert("Вы уже оценивали этот клуб"); return; }

      const club = clubs.find(c => c.id === clubId);
      if (!club) return;

      const newSum   = (club.rating_sum   || 0) + selectedRating;
      const newCount = (club.rating_count || 0) + 1;

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/clubs?id=eq.${clubId}`, {
          method: "PATCH",
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ rating_sum: newSum, rating_count: newCount }),
        });
        if (!res.ok) throw new Error(`Ошибка: ${res.status}`);
      } catch (err) {
        alert("⚠️ Не удалось отправить оценку. Попробуйте позже.");
        return; // localStorage не трогаем при ошибке
      }

      // Обновляем оба кэша
      club.rating_sum   = newSum;
      club.rating_count = newCount;
      if (clubsFull[clubId]) {
        clubsFull[clubId].rating_sum   = newSum;
        clubsFull[clubId].rating_count = newCount;
      }

      rated.push(clubId);
      lsSet("rated_clubs", JSON.stringify(rated));

      closeRatingModal();
      renderClubs();
      alert("Спасибо за оценку ⭐");
    }
  </script>
