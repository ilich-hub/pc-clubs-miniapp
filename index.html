<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Cyber Clubs</title>
  <meta
  name="viewport"

/>

  <!-- ===== style.css (БЕЗ ИЗМЕНЕНИЙ) ===== -->
  <style>
    body {
      margin: 0;
      background: #0b0f19;
      color: #fff;
      font-family: Inter, system-ui, sans-serif;
    }

    header {
  padding: 16px;
  position: sticky;
  top: 0;
  z-index: 500;
  background: #0b0f19;
    }

    select {
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      background: #141a2b;
      color: #fff;
      border: none;
      margin-top: 8px;
    }

    #clubs {
  padding: 16px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
    }

    .card {
  background: linear-gradient(180deg, #141a2b, #0f1322);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  transition: transform .2s ease, box-shadow .2s ease;
  display: flex;
  flex-direction: column;
    }

    /* 👉 Кликабельные зоны */
.zone-item {
  position: relative;
  cursor: pointer;
  transition: transform .15s ease, background .15s ease;
}

.zone-item:active {
  transform: scale(0.97);
  background: #222a44 !important;
}

/* стрелка справа */
.zone-item::after {
  content: "›";
  position: absolute;
  right: 14px;
  font-size: 22px;
  opacity: 0.5;
}
    
    .card:active {
  transform: scale(0.98);
  box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }

    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    .card h2 {
  margin: 12px;
  font-size: 16px;
  font-weight: 600;
  line-height: 1.2;
    }

    .card button {
  margin: 12px;
  margin-top: auto;
  padding: 13px;
  width: calc(100% - 24px);
  border: none;
  border-radius: 14px;
  background: linear-gradient(135deg, #00e5ff, #00bcd4);
  color: #001418;
  font-weight: 700;
  font-size: 14px;
    }

    /* ===== Skeleton ===== */
.skeleton {
  background: #141a2b;
  border-radius: 18px;
  overflow: hidden;
  display: flex;
flex-direction: column;
height: 100%;
}

.skeleton-img {
  height: 140px;
  background: linear-gradient(
    90deg,
    #1a2033 25%,
    #222a44 37%,
    #1a2033 63%
  );
  background-size: 400% 100%;
  animation: shimmer 1.4s ease infinite;
}

.skeleton-text {
  height: 16px;
  margin: 12px;
  border-radius: 8px;
  background: #1a2033;
}

.skeleton-btn {
  height: 44px;
  margin: 12px;
  border-radius: 14px;
  background: #1a2033;
  margin-top: auto;
}

@keyframes shimmer {
  0% { background-position: 100% 0; }
  100% { background-position: -100% 0; }
}

    .tabs {
  display: flex;
  gap: 10px;
  margin: 16px 0;
  overflow-x: auto;
}

.tab {
  padding: 10px 16px;
  border-radius: 20px;
  background: #1a2033;
  color: #aaa;
  font-weight: 600;
  white-space: nowrap;
}

.tab.active {
  background: #00e5ff;
  color: #001418;
}

.section {
  margin-top: 16px;
}

.section h3 {
  margin-bottom: 8px;
}

   #bottomNav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 64px;
  background: #0b0f19;
  display: flex;
  border-top: 1px solid #1f253a;
  z-index: 1000;
}

.nav-btn {
  flex: 1;
  background: none;
  border: none;
  color: #8a93b2;
  font-size: 14px;
  font-weight: 600;
}

.nav-btn.active {
  color: #00e5ff;
}

/* чтобы контент не залезал под меню */
body {
  padding-bottom: 70px;
}

    .card-img-wrap {
  position: relative;
}

.fav-heart {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 22px;
  color: #ffffff;
  opacity: 1; /* 🤍 неактивное */
  background: rgba(0,0,0,0.35);
  border-radius: 50%;
  padding: 6px;
  cursor: pointer;
  transition: transform .2s ease, color .2s ease, opacity .2s ease;
  -webkit-tap-highlight-color: transparent;
user-select: none;
}

.fav-heart.active {
  color: #ff3b3b; /* ❤️ активное */
  opacity: 1;
}

.fav-heart:active {
  transform: scale(0.9);
}

 /* ❤️ Анимация сердечка */
.fav-heart.animate {
  animation: heartPop 0.25s ease;
}

@keyframes heartPop {
  0% {
    transform: scale(1);
  }
  40% {
    transform: scale(1.35);
  }
  70% {
    transform: scale(0.95);
  }
  100% {
    transform: scale(1);
  }
}
    
    .photos-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
    }

    .fade-in {
  animation: fadeIn .35s ease;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

    html, body {
  touch-action: manipulation;
  overscroll-behavior: none;
    }

    .tab-fade-out {
  animation: tabFadeOut .15s ease forwards;
}

.tab-fade-in {
  animation: tabFadeIn .25s ease forwards;
}

@keyframes tabFadeOut {
  from {
    opacity: 1;
    transform: translateY(0);
  }
  to {
    opacity: 0;
    transform: translateY(-6px);
  }
}

@keyframes tabFadeIn {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
    #promoBtn.active,
#tournamentBtn.active {
  background: linear-gradient(135deg, #00e5ff, #00bcd4);
  color: #001418;
  box-shadow: 0 0 0 2px #00e5ff;
  transform: scale(0.95);
}
    #searchToggle.active {
  background: linear-gradient(135deg, #00e5ff, #00bcd4);
  color: #001418;
  box-shadow: 0 0 0 2px #00e5ff;
    }
    .search-animate {
  animation: searchSlide .25s ease;
}

@keyframes searchSlide {
  from {
    opacity: 0;
    transform: translateY(-6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
    .back-btn {
  width:40px;
  height:40px;
  border-radius:50%;
  background:#1a2033;
  border:none;
  color:#fff;
  font-size:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:12px;
  cursor:pointer;
}

.back-btn:active {
  transform: scale(0.92);
}
    /* 🚫 убираем синий tap-highlight у ссылок */
a {
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
    /* ℹ️ Ровные строки информации */
.info-row {
  display: flex;
  align-items: center;   /* КЛЮЧ */
  gap: 10px;

  font-size: 15px;
  line-height: 1.4;
  margin-top: 8px;
}

.info-row svg {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}
    /* 🦴 Skeleton для фото внутри страницы клуба */
.photo-skeleton {
  width: 100%;
  height: 140px;
  border-radius: 14px;
  background: linear-gradient(
    90deg,
    #1a2033 25%,
    #222a44 37%,
    #1a2033 63%
  );
  background-size: 400% 100%;
  animation: shimmer 1.4s ease infinite;
}
    /* 🚫 Убираем синий tap-highlight в Telegram / Android */
* {
  -webkit-tap-highlight-color: transparent;
}
    
    /* ⭐ Анимация нажатия на звёзды */
#ratingStars span {
  transition: transform .15s ease, opacity .15s ease;
}

#ratingStars span:active {
  transform: scale(0.9);
}

/* 📸 Анимация нажатия на фото */
.photos-grid img {
  transition: transform .15s ease;
}

.photos-grid img:active {
  transform: scale(0.97);
}
    
  </style>
</head>

  <script>
    const SUPABASE_URL = "https://dyxfvhjggmessxfuhnbr.supabase.co";
    const SUPABASE_KEY = "sb_publishable_WVIM_p30Vjag_MTxDWapEQ__W0SftDv";
const tg = window.Telegram?.WebApp;
    const clickLock = {};

function lockClick(key, delay = 600) {
  if (clickLock[key]) return true;
  clickLock[key] = true;
  setTimeout(() => delete clickLock[key], delay);
  return false;
}
    
    // 🛡️ Функция для безопасной вставки текста
function safe(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

if (tg) {
  tg.ready();
  tg.expand();
}
    
    // 📋 Константы для повторяющихся действий
const SCROLL_TO_TOP = () => window.scrollTo(0, 0);
const HIDE_HEADER = () => document.querySelector("header").style.display = "none";
const SHOW_HEADER = () => document.querySelector("header").style.display = "block";
    
    const clubsContainer = document.getElementById("clubs");
    const filter = document.getElementById("districtFilter");
    const searchInput = document.getElementById("searchInput");
    const searchToggle = document.getElementById("searchToggle");

searchToggle.onclick = () => {
  const isOpen = searchInput.style.display === "block";

  // 🔴 СБРОС акций / турниров
  specialFilter = "";
  promoBtn.classList.remove("active");
  tournamentBtn.classList.remove("active");

  if (isOpen) {
    searchInput.style.display = "none";
    searchInput.value = "";
    searchToggle.classList.remove("active");
  } else {
    searchInput.style.display = "block";
searchInput.classList.remove("search-animate");
void searchInput.offsetWidth; // перезапуск анимации
searchInput.classList.add("search-animate");
    searchInput.focus();
    searchToggle.classList.add("active");
  }

  renderClubs();
};
    const clubPage = document.getElementById("clubPage");

    let clubs = [];
    function calcRating(club) {
  // 1️⃣ Реальный рейтинг пользователей
  const userRating =
    club.rating_count > 0
      ? club.rating_sum / club.rating_count
      : 0;

  let score = userRating;

  // 2️⃣ Маленькие бонусы (а не замена рейтинга)
  if (club.recommended) score += 0.2;
  if (club.promo) score += 0.1;
  if (club.tournament) score += 0.1;

  // 3️⃣ Ограничиваем максимум
  return Math.min(5, score);
    }

    let activeZoneIndex = 0;
    let clubOpenedFrom = "clubs";
    let specialFilter = ""; // "", "promo", "tournament"
    let skipTabAnimation = false;
    
    
    async function loadClubs() {
  clubsContainer.innerHTML = `
    <div class="skeleton">
      <div class="skeleton-img"></div>
      <div class="skeleton-text"></div>
      <div class="skeleton-btn"></div>
    </div>
    <div class="skeleton">
      <div class="skeleton-img"></div>
      <div class="skeleton-text"></div>
      <div class="skeleton-btn"></div>
    </div>
  `;
  
  // 1️⃣ Пытаемся взять данные из кэша
  const cached = localStorage.getItem("clubs_cache");
  const CACHE_TTL = 24 * 60 * 60 * 1000; // 24 часа
const cacheTime = localStorage.getItem("clubs_cache_time");

if (cached && cacheTime && Date.now() - cacheTime < CACHE_TTL) {
  clubs = JSON.parse(cached);
  renderDistricts();
  renderClubs();
  return; // ⛔ дальше в Supabase НЕ идём
}
  let usingCache = false;

  if (cached) {
    try {
      clubs = JSON.parse(cached);
      renderDistricts();
      renderClubs();
      usingCache = true;
    } catch (e) {
      console.log("Кэш повреждён");
      localStorage.removeItem("clubs_cache"); // удаляем сломанный кэш
    }
  }

  // 2️⃣ Обновляем данные с Supabase
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/clubs?select=*`, {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
      },
    });

    // ✅ ПРОВЕРЯЕМ, что запрос успешен
    if (!res.ok) {
      throw new Error(`Ошибка сервера: ${res.status}`);
    }

    const freshData = await res.json();

    // ✅ ПРОВЕРЯЕМ, что данные валидны
    if (!Array.isArray(freshData)) {
      throw new Error("Неверный формат данных");
    }

    // 3️⃣ Обновляем экран и кэш только если данные изменились
    if (JSON.stringify(freshData) !== JSON.stringify(clubs)) {
      clubs = freshData;
      localStorage.setItem("clubs_cache", JSON.stringify(clubs));
      localStorage.setItem("clubs_cache_time", Date.now());
      renderDistricts();
      renderClubs();
    } else if (usingCache) {
      // Данные те же, но показываем что обновились успешно
      console.log("✅ Данные актуальны");
    }
    
  } catch (err) {
    console.log("⚠️ Ошибка загрузки:", err.message);
    
    // Если кэша нет вообще — показываем ошибку
    if (!usingCache) {
      clubsContainer.innerHTML = `
        <div style="
          padding:40px 20px;
          text-align:center;
          opacity:.7
        ">
          <div style="font-size:48px;margin-bottom:16px">⚠️</div>
          <h3>Не удалось загрузить клубы</h3>
          <p style="opacity:.8;margin:12px 0">
            Проверьте подключение к интернету
          </p>
          <button onclick="loadClubs()" style="
            margin-top:16px;
            padding:12px 24px;
            border:none;
            border-radius:12px;
            background:#00e5ff;
            font-weight:600;
            cursor:pointer;
          ">
            🔄 Попробовать снова
          </button>
        </div>
      `;
    }
    // Если кэш есть — просто используем его (уже показан)
  }
    }

    function renderDistricts() {
  // очищаем список районов
  filter.innerHTML = `<option value="">Все районы</option>`;

  const districts = [...new Set(clubs.map(c => c.district))];

  districts.forEach(d => {
    const opt = document.createElement("option");
    opt.value = d;
    opt.textContent = d;
    filter.appendChild(opt);
  });
    }

    function renderClubs() {
      clubsContainer.innerHTML = "";
let visibleCount = 0;
      const topClubId =
  clubs
    .slice()
    .sort((a, b) => calcRating(b) - calcRating(a))[0]?.id;
      const promoCount = clubs.filter(c => c.promo).length;
const tournamentCount = clubs.filter(c => c.tournament).length;

document.getElementById("promoCount").textContent =
  promoCount > 0 ? promoCount : "";

document.getElementById("tournamentCount").textContent =
  tournamentCount > 0 ? tournamentCount : "";
      if (specialFilter === "promo") {
  clubsContainer.innerHTML = `
    <div style="
      grid-column:1 / -1;
      margin-bottom:12px;
      padding:10px;
      border-radius:12px;
      background:#102a1c;
      color:#00e676;
      font-weight:600;
      text-align:center;
    ">
      🔥 Показаны клубы с акциями
    </div>
  `;
}

if (specialFilter === "tournament") {
  clubsContainer.innerHTML = `
    <div style="
      grid-column:1 / -1;
      margin-bottom:12px;
      padding:10px;
      border-radius:12px;
      background:#1a2033;
      color:#00e5ff;
      font-weight:600;
      text-align:center;
    ">
      🏆 Показаны клубы с турнирами
    </div>
  `;
}

      const selected = filter.value;
const query = searchInput.value.toLowerCase();
      
clubs
  .filter(c => {
    if (specialFilter === "promo" && !c.promo) return false;
    if (specialFilter === "tournament" && !c.tournament) return false;

    return (
      (!selected || c.district === selected) &&
      (!query || (c.name || "").toLowerCase().includes(query))
    );
  })
  .sort((a, b) => {
  const aScore =
    (a.recommended ? 100 : 0) +
    (a.promo ? 2 : 0) +
    (a.tournament ? 1 : 0);

  const bScore =
    (b.recommended ? 100 : 0) +
    (b.promo ? 2 : 0) +
    (b.tournament ? 1 : 0);

  return bScore - aScore;
})
  
  .forEach((c) => {
    visibleCount++;
          const img =
  Array.isArray(c.photos) && c.photos.length
    ? c.photos[0].url
    : "https://via.placeholder.com/400x200";

          clubsContainer.innerHTML += `
            <div class="card">
  <div class="card-img-wrap">
  <img
  src="${img}"
  loading="lazy"
  onerror="this.src='https://via.placeholder.com/400x200'"
>
  ${c.id === topClubId ? `
  <div style="
  position:absolute;
  bottom:10px;
  left:10px;
  padding:5px 10px;

  border:1.5px solid rgba(255,255,255,0.9);
  color:#ffffff;

  font-size:12px;
  font-weight:600;
  border-radius:999px;

  background:rgba(0,0,0,0.25);
  backdrop-filter: blur(4px);
">
  👑 Топ клуб
</div>
` : ""}

  <div class="fav-heart ${isFavorite(c.id) ? "active" : ""}"
     data-id="${c.id}">
  ♥
</div>
</div>

  <h2 style="display:flex;align-items:center;gap:6px">
  ${safe(c.name)}
  <span style="
    font-size:13px;
    color:#f5c451;
    font-weight:700
  ">
    ⭐ ${
  c.rating_count
    ? (c.rating_sum / c.rating_count).toFixed(1)
    : "—"
    }
  </span>
</h2>
  ${c.promo ? `
  <div style="
    margin:0 12px 6px;
    padding:6px 8px;
    background:#102a1c;
    border-radius:8px;
    font-size:12px;
    color:#00e676;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  ">
    🔥 ${safe(c.promo).slice(0, 30)}
  </div>
` : ""}

${c.tournament ? `
  <div style="
    margin:0 12px 6px;
    padding:6px 8px;
    background:#1a2033;
    border-radius:8px;
    font-size:12px;
    color:#00e5ff;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  ">
    🏆 ${safe(c.tournament).slice(0, 30)}
  </div>
` : ""}
  <button onclick="clubOpenedFrom='clubs'; openClub(${Number(c.id)})">Подробнее</button>
</div>
          `;
        });
      if (visibleCount === 0) {
  clubsContainer.innerHTML = `
    <div style="
      grid-column:1 / -1;
      text-align:center;
      padding:40px 20px;
      opacity:.7
    ">
      <div style="font-size:48px;margin-bottom:12px">😕</div>
      <h3>Ничего не найдено</h3>
      <p style="margin-top:8px">
        Попробуйте изменить фильтры или поиск
      </p>
    </div>
  `;
      }
    }

    filter.addEventListener("change", () => {
  specialFilter = "";
  promoBtn.classList.remove("active");
  tournamentBtn.classList.remove("active");
  renderClubs();

    function openMap(lat, lng) {
  // Преобразуем в числа
  const latitude = parseFloat(lat);
  const longitude = parseFloat(lng);
  
  // Проверяем что координаты валидные
  if (
  isNaN(latitude) || isNaN(longitude) ||
  latitude < -90 || latitude > 90 ||
  longitude < -180 || longitude > 180
) {
    alert("❌ Локация клуба не указана или некорректна");
    return;
  }

  window.open(`https://www.google.com/maps?q=${latitude},${longitude}`, "_blank");
    }

    function isClubOpen(workTime) {
  if (!workTime) return null;

  // нормализация
  const clean = workTime
    .replace(/[–—]/g, "-")
    .replace(/\./g, ":")
    .replace(/\s+/g, "");

  if (!clean.includes("-")) return null;

  const [start, end] = clean.split("-");

  const parse = (t) => {
    const [h, m] = t.split(":").map(Number);
    if (isNaN(h) || isNaN(m)) return null;
    return h * 60 + m;
  };

  const s = parse(start);
  const e = parse(end);
  if (s === null || e === null) return null;

  const now = new Date();
  const cur = now.getHours() * 60 + now.getMinutes();

  return s < e
    ? cur >= s && cur <= e
    : cur >= s || cur <= e;
    }

    let selectedRating = 0;
    let currentClubId = null;

function openRatingModal() {
  selectedRating = 0;
  updateStars(0);

  const modal = document.getElementById("ratingModal");
  modal.style.display = "flex";

  const starsContainer = document.getElementById("ratingStars");

  // 🔒 чтобы не вешать обработчик несколько раз
  if (!starsContainer.dataset.ready) {
    starsContainer.dataset.ready = "1";

    starsContainer.addEventListener("click", e => {
      const star = e.target.closest("span");
      if (!star) return;

      const value = Number(star.dataset.star);
      updateStars(value);
    });
  }
}

function closeRatingModal() {
  document.getElementById("ratingModal").style.display = "none";
}

function updateStars(count) {
  selectedRating = count;

  const stars = document.querySelectorAll("#ratingStars span");

  stars.forEach((star, index) => {
    if (index < count) {
      star.style.opacity = "1";
      star.style.filter = "grayscale(0)";
    } else {
      star.style.opacity = "0.3";
      star.style.filter = "grayscale(1)";
    }
  });
}

async function submitRating() {
  if (selectedRating === 0) {
    alert("Выберите оценку");
    return;
  }

  const clubId = currentClubId;

if (!clubId) {
  alert("Ошибка клуба");
  return;
}

  const rated = JSON.parse(localStorage.getItem("rated_clubs") || "[]");
  if (rated.includes(clubId)) {
    alert("Вы уже оценивали этот клуб");
    return;
  }

  const club = clubs.find(c => c.id === clubId);
  if (!club) return;

  const newSum = (club.rating_sum || 0) + selectedRating;
  const newCount = (club.rating_count || 0) + 1;

  await fetch(`${SUPABASE_URL}/rest/v1/clubs?id=eq.${clubId}`, {
    method: "PATCH",
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      rating_sum: newSum,
      rating_count: newCount
    })
  });

  rated.push(clubId);
  localStorage.setItem("rated_clubs", JSON.stringify(rated));

  club.rating_sum = newSum;
  club.rating_count = newCount;

  closeRatingModal();
  renderClubs();
  alert("Спасибо за оценку ⭐");
}
